name: Publish CalmStart ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-calmstart-zip.yml"

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          archive_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$archive_dir"
          rm -rf "$archive_dir/.github"
          rm -f CalmStart-1.1.0.zip
          (cd "$archive_dir" && zip -qr "$GITHUB_WORKSPACE/CalmStart-1.1.0.zip" .)

      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-calmstart-zip.yml
          git add CalmStart-1.1.0.zip
          git commit -m "build: add CalmStart 1.1.0 ZIP"
          git push
