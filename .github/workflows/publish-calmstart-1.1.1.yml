name: Publish CalmStart 1.1.1 ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-calmstart-1.1.1.yml"

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and create ZIP
        run: |
          grep -q '"version": "1.1.0"' manifest.json
          sed -i 's/"version": "1.1.0"/"version": "1.1.1"/' manifest.json
          grep -q '"version": "1.1.1"' manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm CalmStart-1.1.0.zip
          git rm .github/workflows/publish-calmstart-1.1.1.yml
          git add manifest.json
          tree_sha="$(git write-tree)"
          git archive --format=zip --output=CalmStart-1.1.1.zip "$tree_sha"
          unzip -t CalmStart-1.1.1.zip
          git add CalmStart-1.1.1.zip
          git commit -m "release: CalmStart 1.1.1"
          git push
